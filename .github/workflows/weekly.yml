name: סל שבועי

on:
  schedule:
    - cron: "0 5 * * 0"   # כל יום ראשון ב-07:00/08:00 שעון ישראל
  workflow_dispatch:       # הרצה ידנית מכפתור ב-GitHub

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python compare.py
      - name: שמירת העמוד המעודכן
        run: |
          git config user.name "sal-agent"
          git config user.email "sal-agent@users.noreply.github.com"
          git add docs
          git commit -m "עדכון סל $(date +%F)" || echo "אין שינוי"
          git push
